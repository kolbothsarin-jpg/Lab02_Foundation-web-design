<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4</title>
    <style>
.wrapper{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.small,
.big{
    color: white;
    padding: 10px 20px;
}

.small{
    background-color: rgb(248, 117, 94);
}

.big{
    background-color: yellowgreen;
}

.big{
    display: none;
}

@media only screen and (max-width: 599px){
    .small{
        display: inline;
    }

    .big{
        display: none;
    }
}

@media only screen and (min-width: 600px){
    .small{
        display: none;
    }

    .big{
        display: inline;
    }
}
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="content">
            <span class="small">I'm SMALL 😥</span>
            <span class="big">I'm BIG 😱</span>
        </div>
    </div>
</body>
</html>
