<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }
      .pricing-container {
        background-color: rgb(204, 221, 216); 
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
      }
      .pricing-plan {
        background-color: #f7f4e4;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        flex: 1 1 auto;
      }
      .plan-title {
        font-size: 24px;
        font-weight: bold;
        background-color: rgb(86, 86, 129);
        box-shadow: #ea2222;
        border-radius: 10px;
      }

      .plan-price {
        font-size: 30px;
        font-weight: bold;
        margin-top: 15px;
      }

      .plan-features {
        list-style: none;
        padding: 0;
      }
      
      .plan-features li {
        width: 200px;
        text-align: left;
      }
      .plan-button {
        background-color: rgb(53, 53, 71);
        color: white;
        border: none;
        width: 150px;
        padding: 10px;
        border-radius: 10px;
      }
      .plan-button:hover {
        background-color: rgb(56, 28, 181);
        color: white;
        border: none;
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
      }


      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
          background-color: rgb(204, 221, 216);
          flex-direction: column;
      }
      }

    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
